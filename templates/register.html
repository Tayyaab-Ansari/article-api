{% extends "base.html" %}
{% block title %}Sign up{% endblock %}

{% block content %}
<section class="panel auth">
  <h1>Create your account</h1>
  <p class="page-sub">It takes a minute. Then you can start writing.</p>

  <form id="register-form" novalidate>
    <p class="alert" data-form-error role="alert" hidden></p>
    <div class="field">
      <label for="username">Username</label>
      <input class="field-input" id="username" name="username" autocomplete="username" required autofocus>
      <p class="field-error" data-error-for="username" hidden></p>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input class="field-input" id="email" name="email" type="email" autocomplete="email" required>
      <p class="field-error" data-error-for="email" hidden></p>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input class="field-input" id="password" name="password" type="password" autocomplete="new-password" required>
      <p class="field-error" data-error-for="password" hidden></p>
    </div>
    <div class="field">
      <label for="password2">Confirm password</label>
      <input class="field-input" id="password2" name="password2" type="password" autocomplete="new-password" required>
      <p class="field-error" data-error-for="password2" hidden></p>
    </div>
    <button class="btn btn-primary btn-block" type="submit">Create account</button>
  </form>
  <p class="form-foot">Already have an account? <a href="/login/">Log in</a></p>
</section>
{% endblock %}

{% block scripts %}
<script>
document.getElementById("register-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const form = e.target;
  const btn = form.querySelector("button[type=submit]");
  clearErrors(form);
  setBusy(btn, true, "Creating account...");
  try {
    const res = await fetch("/auth/register/", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        username: form.username.value,
        email: form.email.value,
        password: form.password.value,
        password2: form.password2.value,
      }),
    });
    if (res.status === 201) {
      flash("Account created. Log in to continue.");
      window.location = "/login/";
      return;
    }
    const data = await res.json().catch(() => ({}));
    showErrors(form, data);
  } catch (err) {
    showErrors(form, {non_field: "Could not reach the server. Check your connection."});
  }
  setBusy(btn, false);
});
</script>
{% endblock %}
