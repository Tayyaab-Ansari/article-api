{% extends "base.html" %}
{% block title %}Register{% endblock %}

{% block content %}
<h1>Register</h1>
<form id="register-form">
  <label>Username <input name="username" required></label>
  <label>Email <input name="email" type="email"></label>
  <label>Password <input name="password" type="password" required></label>
  <label>Confirm password <input name="password2" type="password" required></label>
  <button type="submit">Register</button>
  <p id="error" class="error"></p>
</form>
{% endblock %}

{% block scripts %}
<script>
document.getElementById("register-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = new FormData(e.target);
  const err = document.getElementById("error");
  err.textContent = "";

  // Register open endpoint hai, is liye apiFetch nahi, seedha fetch (token nahi chahiye)
  const res = await fetch("/auth/register/", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      username: f.get("username"),
      email: f.get("email"),
      password: f.get("password"),
      password2: f.get("password2"),
    }),
  });

  if (res.status === 201) {
    window.location = "/login/";
  } else if (res.status === 400) {
    const errors = await res.json();
    // {"password": ["This password is too common."], "username": [...]}
    err.textContent = Object.entries(errors)
      .map(([field, msgs]) => field + ": " + [].concat(msgs).join(" "))
      .join(" | ");
  } else {
    err.textContent = "Something went wrong (" + res.status + ")";
  }
});
</script>
{% endblock %}
