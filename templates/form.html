{% extends "base.html" %}
{% block title %}New article{% endblock %}

{% block content %}
<h1 id="heading">New article</h1>
<form id="article-form">
  <label>Title <input name="title" required maxlength="255"></label>
  <label>Subtitle <input name="subtitle" maxlength="255"></label>
  <label>Description <textarea name="description" rows="6" required></textarea></label>
  <button type="submit">Save</button>
  <p id="error" class="error"></p>
</form>
{% endblock %}
{% block scripts %}
<script>
if (!getAccess()) { window.location = "/login/"; }

// URL se id nikalo: /edit/5/ -> 5, /new/ -> null
const match = window.location.pathname.match(/^\/edit\/(\d+)\/$/);
const articleId = match ? match[1] : null;
const form = document.getElementById("article-form");

// Edit mode: purana data form mein bharo
if (articleId) {
  document.getElementById("heading").textContent = "Edit article";
  apiFetch("/articles/" + articleId + "/").then(async (res) => {
    if (!res.ok) { window.location = "/"; return; }
    const a = await res.json();
    form.title.value = a.title;
    form.subtitle.value = a.subtitle;
    form.description.value = a.description;
  });
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const data = new FormData(form);
  const res = await apiFetch(articleId ? "/articles/" + articleId + "/" : "/articles/", {
    method: articleId ? "PUT" : "POST",
    body: JSON.stringify({
      title: data.get("title"),
      subtitle: data.get("subtitle"),
      description: data.get("description"),
    }),
  });
  const err = document.getElementById("error");
  if (res.ok) {
    window.location = "/";
  } else if (res.status === 400) {
    const errors = await res.json();
    err.textContent = Object.entries(errors)
      .map(([field, msgs]) => field + ": " + msgs.join(" "))
      .join(" | ");
  } else if (res.status === 403) {
    err.textContent = "You can only edit your own articles.";
  }
});
</script>
{% endblock %}
